<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manuel David</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Manuel David">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Applies the saved theme before the page is drawn, to avoid a flash.
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
