name: Deploy

# Started by hand for now. Switch to "push on main" once Azure is set up and the secrets below exist:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID                         (terraform output github_client_id / github_tenant_id)
#   AZURE_SUBSCRIPTION_ID                                    (your subscription id)
#   DATABASE_URL                                             (terraform output database_url)
#   AZURE_FUNCTION_APP_NAME                                  (terraform output function_app_name)
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: rg-davidmanuel
  API_APP: ca-davidmanuel-api
  WEB_APP: ca-davidmanuel-web
  IMAGE: ghcr.io/manueldavid69/portfolio

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE }}-api:${{ github.sha }},${{ env.IMAGE }}-api:latest

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The database only accepts Azure services. The runner's IP is allowed just for the migrations.
      - name: Open the database to this runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create -g $RESOURCE_GROUP --server-name psql-davidmanuel --name github-runner --start-ip-address $RUNNER_IP --end-ip-address $RUNNER_IP

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Database migrations
        working-directory: apps/api
        run: npm ci && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Close the database again
        if: always()
        run: az postgres flexible-server firewall-rule delete -g $RESOURCE_GROUP --server-name psql-davidmanuel --name github-runner --yes

      - name: New revision of the Container App
        run: az containerapp update -g $RESOURCE_GROUP -n $API_APP --image $IMAGE-api:${{ github.sha }}

  functions:
    name: Fonctions C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish functions/src/Portfolio.Functions -c Release -o publish
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1.5.7
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: publish
          sku: flexconsumption

  web:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/web
          push: true
          tags: ${{ env.IMAGE }}-web:${{ github.sha }},${{ env.IMAGE }}-web:latest
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: New revision of the website
        run: az containerapp update -g $RESOURCE_GROUP -n $WEB_APP --image $IMAGE-web:${{ github.sha }}
