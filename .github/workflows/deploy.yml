name: Deploy

# Started by hand for now. Switch to "push on main" once Azure is set up and the secrets below exist:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (login with OpenID Connect, no password)
#   AZURE_STATIC_WEB_APPS_TOKEN                              (terraform output static_web_app_token)
#   DATABASE_URL                                             (terraform output database_url)
#   AZURE_FUNCTION_APP_NAME                                  (terraform output function_app_name)
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: rg-davidmanuel
  CONTAINER_APP: ca-davidmanuel-api
  IMAGE: ghcr.io/manueldavid69/portfolio-api

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Database migrations
        working-directory: apps/api
        run: npm ci && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: New revision of the Container App
        run: az containerapp update -g $RESOURCE_GROUP -n $CONTAINER_APP --image $IMAGE:${{ github.sha }}

  functions:
    name: Fonctions C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish functions/src/Portfolio.Functions -c Release -o publish
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1.5.7
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: publish
          sku: flexconsumption

  web:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npx ng build
        working-directory: apps/web
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          action: upload
          app_location: apps/web/dist/web/browser
          skip_app_build: true
