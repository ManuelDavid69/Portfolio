name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Site Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  api:
    name: API NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Testcontainers starts a real PostgreSQL in Docker, which is available on GitHub runners.
      - run: npm run test:e2e

  # On main, the Docker images are published on GitHub Packages. Azure pulls them from there.
  images:
    name: Images Docker
    if: github.ref == 'refs/heads/main'
    needs: [web, api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ghcr.io/manueldavid69/portfolio-${{ matrix.app }}:${{ github.sha }},ghcr.io/manueldavid69/portfolio-${{ matrix.app }}:latest

  functions:
    name: Fonctions C#
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
